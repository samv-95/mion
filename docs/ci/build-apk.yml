name: Build debug APK

# TEMPLATE — copy this file to .github/workflows/build-apk.yml to enable it.
# It is kept out of .github/workflows/ because the automation token that created
# this branch has no `workflows` permission, so pushing it there is rejected.
#
# Manual run: Actions ▸ Build debug APK ▸ Run workflow.
# Produces an installable app-debug.apk artifact.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle task to run'
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - assembleRelease

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # AGP 9.x + Gradle 9.x both run on JDK 17+, JDK 21 is the safe choice
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # compileSdk 36 (minorApiLevel 1) may need the 36.1 platform, which is
          # published independently — don't fail the job if it is missing.
          sdkmanager --install "platforms;android-36.1" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # keep in sync with gradle/wrapper/gradle-wrapper.properties
          gradle-version: '9.3.1'
          validate-wrappers: false

      # The repository ships only gradle-wrapper.properties (no ./gradlew), so the
      # wrapper scripts are generated on the fly and then used for the build.
      - name: Generate Gradle wrapper + debug keystore
        run: |
          gradle wrapper --gradle-version 9.3.1
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew ${{ inputs.variant || 'assembleDebug' }} --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p build-artifacts
          find app/build/outputs -name '*.apk' -exec cp {} build-artifacts/ \;
          ls -la build-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: aura-ai-apk
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
