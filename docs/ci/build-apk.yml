name: Build debug APK

# TEMPLATE — copy this file to .github/workflows/build-apk.yml to enable it.
# It is kept out of .github/workflows/ because the automation token that created
# this branch has no `workflows` scope, so pushing it there is rejected.
#
# Manual run: Actions ▸ Build debug APK ▸ Run workflow.
# Produces an installable app-debug.apk artifact.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle task to run'
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - assembleRelease

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      # The repository ships only gradle-wrapper.properties (no ./gradlew), so the
      # wrapper is generated on the fly and then used for the build.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew ${{ inputs.variant || 'assembleDebug' }} --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p build-artifacts
          find app/build/outputs -name '*.apk' -exec cp {} build-artifacts/ \;
          ls -la build-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: aura-ai-apk
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
